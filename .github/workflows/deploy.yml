# ============================================================
# CI/CD — test TOÀN DIỆN trước, PASS hết mới deploy.
#   - PR vào main/develop hoặc chạy tay → 3 job BE/FE/Agent chạy SONG SONG,
#     job tổng "Test toàn diện (BE + FE + Agent)" gom kết quả (giữ tên để
#     branch protection không đổi).
#   - CHỈ khi push vào main → job `deploy` SSH vào VPS (deploy.sh có smoke test
#     + tự rollback nếu bản mới lỗi).
# Tối ưu tốc độ: 3 job song song (thay vì nối tiếp) + cache yarn/uv/next.
# Secrets cần: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT
# ============================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma 7 cần DATABASE_URL để load config lúc generate/build (KHÔNG kết nối thật).
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"

jobs:
  # ---------- Backend (song song) ----------
  be:
    name: BE · tsc + test + build
    # Chạy cả trên push main để LƯU cache scope=main → mọi PR sau restore được
    # (cache tạo trong PR chỉ PR đó thấy; phải lưu ở main mới dùng chung).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22 (+cache yarn)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: be/yarn.lock
      - name: Cache node_modules (BE)
        id: nmbe
        uses: actions/cache@v4
        with:
          path: be/node_modules
          key: nm-be-${{ hashFiles('be/yarn.lock') }}
      - name: install (chỉ khi cache MISS — hit thì dùng luôn, khỏi cài lại)
        if: steps.nmbe.outputs.cache-hit != 'true'
        working-directory: be
        run: yarn install --frozen-lockfile --prefer-offline
      - name: prisma generate
        working-directory: be
        run: yarn prisma:generate
      - name: tsc + test + build (SONG SONG)
        working-directory: be
        run: |
          yarn tsc --noEmit & A=$!
          yarn test & B=$!
          yarn build & C=$!
          ok=0
          wait $A || ok=1
          wait $B || ok=1
          wait $C || ok=1
          exit $ok

  # ---------- Frontend (song song) ----------
  fe:
    name: FE · lint + tsc + build
    # Chạy cả trên push main để LƯU cache scope=main → mọi PR sau restore được
    # (cache tạo trong PR chỉ PR đó thấy; phải lưu ở main mới dùng chung).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22 (+cache yarn)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: fe/yarn.lock
      - name: Cache node_modules (FE)
        id: nmfe
        uses: actions/cache@v4
        with:
          path: fe/node_modules
          key: nm-fe-${{ hashFiles('fe/yarn.lock') }}
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: fe/.next/cache
          key: next-${{ hashFiles('fe/yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('fe/yarn.lock') }}-
      - name: install (chỉ khi cache MISS — hit thì dùng luôn, khỏi cài lại)
        if: steps.nmfe.outputs.cache-hit != 'true'
        working-directory: fe
        run: yarn install --frozen-lockfile --prefer-offline
      - name: lint + tsc + build (SONG SONG)
        working-directory: fe
        run: |
          yarn lint & L=$!
          yarn tsc --noEmit & T=$!
          yarn build & B=$!
          ok=0
          wait $L || ok=1
          wait $T || ok=1
          wait $B || ok=1
          exit $ok

  # ---------- Agent (song song) ----------
  agent:
    name: Agent · pytest
    # Chạy cả trên push main để LƯU cache scope=main → mọi PR sau restore được
    # (cache tạo trong PR chỉ PR đó thấy; phải lưu ở main mới dùng chung).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # KHÔNG enable-cache của setup-uv: cache tải của uv >1GB → restore còn CHẬM
      # hơn cài mới (đo được 215s). Thay vào đó cache thẳng .venv (nhỏ hơn nhiều).
      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Cache .venv
        id: venv
        uses: actions/cache@v4
        with:
          path: agent/.venv
          key: venv-${{ hashFiles('agent/uv.lock') }}-py313
      - name: uv sync (chỉ khi cache MISS)
        if: steps.venv.outputs.cache-hit != 'true'
        working-directory: agent
        run: uv sync --frozen
      - name: pytest (tất định, bỏ test LLM live)
        working-directory: agent
        env:
          GOOGLE_API_KEY: ci-dummy-key
          TAVILY_API_KEYS: ci-dummy
        run: uv run --no-sync pytest -q -m "not live"

  # ---------- Gate tổng: GIỮ NGUYÊN TÊN cho branch protection ----------
  test:
    name: Test toàn diện (BE + FE + Agent)
    needs: [be, fe, agent]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Kết luận (đỏ nếu 1 phần bất kỳ fail)
        run: |
          echo "BE=${{ needs.be.result }} | FE=${{ needs.fe.result }} | Agent=${{ needs.agent.result }}"
          [ "${{ needs.be.result }}" = "success" ] \
            && [ "${{ needs.fe.result }}" = "success" ] \
            && [ "${{ needs.agent.result }}" = "success" ]

  deploy:
    name: Deploy lên VPS (push main — đã qua PR test)
    # KHÔNG needs:test — commit vào main chỉ đến từ PR đã test xanh (branch protection).
    # deploy.sh vẫn có smoke test + tự rollback nếu bản mới lỗi.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: SSH & deploy (có rollback nếu health fail)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -e
            export PATH="$HOME/.local/bin:/usr/bin:/usr/local/bin:$PATH"
            cd $HOME/vhdcorp
            # Cập nhật checkout TRƯỚC khi chạy deploy.sh — nếu không, lần deploy trước
            # rollback để lại deploy.sh CŨ và bản cũ đó chính là script được thực thi.
            git fetch origin main
            # Bỏ mọi thay đổi local trước khi checkout (file runtime *.local đã gitignore).
            git reset --hard HEAD
            git checkout -B main origin/main
            git reset --hard origin/main
            DEPLOY_BRANCH=main bash scripts/deploy.sh
