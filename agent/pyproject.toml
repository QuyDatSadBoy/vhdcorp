[project]
name = "vhd-agent"
version = "0.1.0"
description = "VHD Corp AI chat agent service (FastAPI + LangGraph + Gemini)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-google-genai>=2.1",
    "langchain-core>=0.3",
    "aiosqlite>=0.21",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "mcp>=1.28.1",
    "asyncpg>=0.31.0",
    "langchain-openai>=1.3.5",
    "deepagents>=0.7.8",
    "langchain-mcp-adapters>=0.3.2",
    "ag-ui-langgraph>=0.0.43",
    "copilotkit>=0.1.95",
    "pypdf>=6.16.2",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: test cần kết nối mạng/dịch vụ thật (có thể skip khi offline)",
    "live: test gọi MODEL THẬT — tốn tiền, chậm, và phụ thuộc hạn mức nhà cung cấp",
]
# Mặc định BỎ QUA nhóm `live`: bốn phép thử đó gọi model thật nên khi chạy cả bộ
# hay dính hạn mức và báo đỏ dù code không sai (chạy riêng thì xanh). Đường đi thật
# đã có scripts/e2e-agent.py kiểm qua HTTP với model thật.
# Muốn chạy cả nhóm này: pytest -m "live or not live"
addopts = "-m 'not live'"

[tool.uv]
package = false
