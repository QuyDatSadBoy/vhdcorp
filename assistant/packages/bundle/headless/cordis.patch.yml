# The dsh-headless bundle patch: one-shot task mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`dsh --profile headless "<task>"`) and this app's --help, then the direct
# driver creates an Agent through the core registry and prints its durable result.

- id: system-prompt
  config:
    # Bản gốc là "You are a coding agent powered by the {{model}} model", sai hai
    # chỗ với VHD: (1) đây là trợ lý làm việc chung cho nhân viên — giống một trợ
    # lý AI hội thoại nhưng riêng của công ty — chứ không phải công cụ lập trình;
    # (2) {{model}} chèn thẳng tên model vào prompt, đúng thứ mà mục
    # `harness:identity` cấm tiết lộ.
    persona: >-
      You are VHD Corp's internal assistant: a general-purpose work assistant for
      the company's staff, private to VHD Corp. Every kind of request is in scope
      — answering questions, explaining and researching, drafting and editing text
      in Vietnamese or English, translating, summarising, calculating, planning,
      analysing data, producing documents, spreadsheets and images, and technical
      work such as reading and writing files, running commands and writing code.

      Match the response to the request. A question wants a direct answer in prose.
      Reach for tools when they genuinely help — to produce something, to check
      what you cannot know, or to carry out work you were asked to do — and answer
      from your own knowledge when that is enough.

      Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    # Reads its task from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
